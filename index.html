

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123b66">
<title>Cost Alarm - Smart Business Management</title>
<style>
:root {
 --navy:#123b66;
 --blue:#1769aa;
 --bg:#f3f6fb;
 --card:#fff;
 --ink:#182230;
 --muted:#667085;
 --border:#e3e8ef;
}
body.dark {
 --bg:#101923;
 --card:#1b2938;
 --ink:#f1f5f9;
 --muted:#aab6c4;
 --border:#354455;
}
*{box-sizing:border-box}
body{
 margin:0;
 background:var(--bg);
 color:var(--ink);
 font-family:Arial,sans-serif;
}
header{
 background:var(--navy);
 color:white;
 padding:16px;
}
header h2{margin:0}
header small{display:block;margin:7px 0 12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions a,.actions button{
 padding:10px;
 border:0;
 border-radius:8px;
 color:white;
 text-decoration:none;
 font-weight:bold;
}
.call{background:#16835b}
.wa{background:#20bd65}
.theme{background:#53677e}
nav{
 display:flex;
 gap:6px;
 overflow-x:auto;
 background:var(--card);
 padding:9px;
 position:sticky;
 top:0;
 z-index:5;
}
nav button{
 white-space:nowrap;
 border:0;
 border-radius:7px;
 padding:10px;
 background:#eaf1f8;
 color:#123b66;
}
nav button.active{
 background:var(--navy);
 color:white;
}
main{
 max-width:950px;
 margin:auto;
 padding:14px;
}
.page{display:none}
.page.active{display:block}
.card{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:12px;
 padding:14px;
 margin-bottom:12px;
}
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}
.stat small{color:var(--muted)}
.stat strong{
 display:block;
 font-size:21px;
 margin-top:8px;
}
label{
 display:block;
 font-weight:bold;
 font-size:13px;
 margin:10px 0 5px;
}
input,select,textarea{
 width:100%;
 padding:11px;
 border:1px solid var(--border);
 border-radius:8px;
 background:var(--card);
 color:var(--ink);
 font-size:15px;
}
textarea{min-height:65px}
button{cursor:pointer}
.primary,.secondary,.danger{
 border:0;
 border-radius:8px;
 padding:11px 14px;
 margin-top:10px;
 font-weight:bold;
}
.primary{background:var(--blue);color:white}
.secondary{background:#eaf1f8;color:#123b66}
.danger{background:#fee4e2;color:#b42318}
.row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}
.tablewrap{overflow-x:auto}
table{
 width:100%;
 border-collapse:collapse;
 min-width:430px;
 font-size:13px;
}
td,th{
 padding:9px 6px;
 border-bottom:1px solid var(--border);
 text-align:left;
}
th{background:#edf2f7;color:#123b66}
body.dark th{background:#26384a;color:white}
.good{
 background:#e3f7eb;
 color:#126438;
 padding:10px;
 border-radius:8px;
}
.warn{
 background:#fff0c2;
 color:#805b00;
 padding:10px;
 border-radius:8px;
}
.progress{
 height:12px;
 background:var(--border);
 border-radius:20px;
 overflow:hidden;
}
.progress span{
 display:block;
 height:100%;
 background:var(--blue);
 width:0;
}
footer{
 text-align:center;
 color:var(--muted);
 padding:20px;
 font-size:12px;
}
@media(max-width:480px){
 .row{grid-template-columns:1fr}
 .stat strong{font-size:18px}
}
</style>
</head>
<body>

<header>
<h2>🔔 Cost Alarm</h2>
<small>স্মার্ট বিজনেস ম্যানেজমেন্ট</small>
<div class="actions">
<a class="call" href="tel:+8801917716922">📞 01917716922</a>
<a class="wa" href="https://wa.me/8801917716922" target="_blank">💬 WhatsApp</a>
<button class="theme" onclick="toggleTheme()">🌙 থিম</button>
</div>
</header>

<nav>
<button class="active" onclick="page('dashboard',this)">ড্যাশবোর্ড</button>
<button onclick="page('transactions',this)">আয়-ব্যয়</button>
<button onclick="page('budget',this)">বাজেট</button>
<button onclick="page('products',this)">পণ্য ও স্টক</button>
<button onclick="page('people',this)">গ্রাহক</button>
<button onclick="page('reports',this)">রিপোর্ট</button>
<button onclick="page('settings',this)">সেটিংস</button>
</nav>

<main>

<section id="dashboard" class="page active">
<h3>📊 ব্যবসার ড্যাশবোর্ড</h3>
<div class="grid">
<div class="card stat">
<small>মোট আয়</small>
<strong id="income">৳0</strong>
</div>
<div class="card stat">
<small>মোট ব্যয়</small>
<strong id="expense">৳0</strong>
</div>
<div class="card stat">
<small>নিট লাভ / ক্ষতি</small>
<strong id="profit">৳0</strong>
</div>
<div class="card stat">
<small>মোট লেনদেন</small>
<strong id="count">0</strong>
</div>
<div class="card stat">
<small>আজকের আয়</small>
<strong id="todayIn">৳0</strong>
</div>
<div class="card stat">
<small>আজকের ব্যয়</small>
<strong id="todayOut">৳0</strong>
</div>
<div class="card stat">
<small>বাজেট অবশিষ্ট</small>
<strong id="remaining">৳0</strong>
</div>
<div class="card stat">
<small>মোট পণ্য</small>
<strong id="productCount">0</strong>
</div>
</div>
<div class="card">
<h3>সাম্প্রতিক লেনদেন</h3>
<div class="tablewrap">
<table>
<thead>
<tr><th>তারিখ</th><th>বিবরণ</th><th>ধরন</th><th>টাকা</th></tr>
</thead>
<tbody id="recent"></tbody>
</table>
</div>
</div>
<div id="alerts"></div>
</section>
