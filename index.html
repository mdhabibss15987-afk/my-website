
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123b66">
<title>Cost Alarm - Smart Expense Manager</title>
<style>
:root{font-family:Arial,sans-serif;color:#182230;background:#f3f6fb}
*{box-sizing:border-box}
body{margin:0;background:#f3f6fb}
header{background:linear-gradient(120deg,#123b66,#155eef);color:#fff;padding:25px 16px;text-align:center}
header h1{margin:0 0 8px;font-size:30px}
header p{margin:0;opacity:.94}
main{max-width:900px;margin:auto;padding:12px}
.panel{background:#fff;padding:18px;border-radius:15px;margin:14px 0;box-shadow:0 3px 15px #0001}
h2{font-size:19px;color:#123b66;margin:0 0 14px}
label{display:block;margin:10px 0 5px;font-weight:bold}
input,select{width:100%;padding:12px;border:1px solid #cfd5df;border-radius:9px;font-size:16px;background:#fff;color:#182230}
input:focus,select:focus{outline:2px solid #9bbcff;border-color:#155eef}
button,.contact{display:inline-block;padding:12px 16px;border:0;border-radius:9px;background:#155eef;color:#fff;font-weight:bold;cursor:pointer;margin:7px 4px 0 0;text-decoration:none;font-size:14px}
button:disabled{opacity:.5;cursor:not-allowed}
.danger{background:#b42318}.green{background:#087443}.muted{background:#475467}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.stat{background:#f0f5ff;padding:14px;border-radius:10px;overflow-wrap:anywhere;min-width:0}
.stat small{display:block;color:#667085;margin-bottom:5px}
.stat strong{font-size:clamp(16px,2.8vw,21px)}
.notice,.chat{padding:13px;background:#fff4dc;border-radius:10px;margin-top:12px;white-space:pre-wrap;line-height:1.5}
.good{background:#e8f8ee;color:#087443}.bad{background:#fee;color:#b42318}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eee}
.item:last-child{border-bottom:0}
.item small{display:block;color:#667085;margin-top:4px;overflow-wrap:anywhere}
.item .amount{font-weight:bold;white-space:nowrap}
.item button{padding:7px 10px;font-size:12px}
.hint{font-size:13px;color:#667085;line-height:1.5}
.actions{display:flex;flex-wrap:wrap;gap:6px}
footer{text-align:center;padding:20px;color:#667085}
.contact{margin:5px}
[dir="rtl"] body,[dir="rtl"] input,[dir="rtl"] select{text-align:right}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){main{padding:8px}.panel{padding:14px}.item{align-items:flex-start}.item .right{text-align:right}}
</style>
</head>
<body>
<header>
<h1>Cost Alarm</h1>
<p id="subtitle"></p>
</header>
<main>
<section class="panel">
<div class="grid">
<div><label id="languageLabel" for="language"></label>
<select id="language">
<option value="bn">বাংলা</option><option value="en-GB">English (UK)</option><option value="en-US">English (US)</option>
<option value="ar">العربية</option><option value="fr">Français</option><option value="de">Deutsch</option>
<option value="it">Italiano</option><option value="es">Español</option><option value="pt">Português</option><option value="nl">Nederlands</option>
</select></div>
<div><label id="currencyLabel" for="currency"></label>
<select id="currency"><option value="BDT">BDT ৳</option><option value="USD">USD $</option><option value="GBP">GBP £</option><option value="EUR">EUR €</option></select></div>
</div>
<p id="currencyHint" class="hint"></p>
</section>

<section class="panel">
<h2 id="budgetTitle"></h2>
<label id="budgetLabel" for="budget"></label>
<input id="budget" type="number" min="0" step="0.01" inputmode="decimal">
<button id="saveBudget"></button>
<div class="stats">
<div class="stat"><small id="budgetText"></small><strong id="budgetValue">৳0</strong></div>
<div class="stat"><small id="incomeText"></small><strong id="incomeValue">৳0</strong></div>
<div class="stat"><small id="spentText"></small><strong id="spentValue">৳0</strong></div>
<div class="stat"><small id="remainingText"></small><strong id="remainingValue">৳0</strong></div>
</div>
<div id="alert" class="notice"></div>
</section>

<section class="panel">
<h2 id="addExpenseTitle"></h2>
<label id="expenseAmountLabel" for="amount"></label>
<input id="amount" type="number" min="0" step="0.01" inputmode="decimal">
<label id="categoryLabel" for="category"></label>
<select id="category">
<option value="food"></option><option value="transport"></option><option value="home"></option><option value="shopping"></option><option value="health"></option><option value="bills"></option><option value="other"></option>
</select>
<label id="noteLabel" for="note"></label>
<input id="note">
<button id="addExpense"></button>
</section>

<section class="panel">
<h2 id="addIncomeTitle"></h2>
<label id="incomeAmountLabel" for="incomeAmount"></label>
<input id="incomeAmount" type="number" min="0" step="0.01" inputmode="decimal">
<label id="incomeNoteLabel" for="incomeNote"></label>
<input id="incomeNote">
<button id="addIncome" class="green"></button>
</section>

<section class="panel">
<h2 id="historyTitle"></h2>
<div id="expenseList"></div>
<div class="actions"><button id="download"></button><button class="danger" id="clear"></button></div>
</section>

<section class="panel">
<h2 id="assistantTitle"></h2>
<p id="assistantIntro"></p>
<div id="assistantReply" class="chat" aria-live="polite"></div>
<button id="analyze"></button>
<label id="questionLabel" for="aiQuestion"></label>
<input id="aiQuestion">
<button id="askAI"></button>
<p id="disclosure" class="hint"></p>
</section>

<section class="panel">
<h2 id="contactTitle"></h2>
<p><span id="mobileLabel"></span>: <strong>01917716922</strong></p>
<a class="contact" href="tel:+8801917716922" id="callLink">📞 <span id="callText"></span></a>
<a class="contact green" href="https://wa.me/8801917716922" target="_blank" rel="noopener noreferrer" id="whatsappLink">WhatsApp</a>
</section>
<footer>Cost Alarm - Smart Expense Manager</footer>
</main>
