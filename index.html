

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cost Alarm - Smart Budget Alarm</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#eef2f7;margin:0;padding:16px;color:#172033}
.app{max-width:550px;margin:auto;background:white;padding:22px;border-radius:20px;box-shadow:0 5px 20px #0001}
h1{text-align:center;color:#123b66}
input{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;margin:8px 0 15px;font-size:17px}
button{border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:bold;cursor:pointer}
.primary{background:#1877f2;color:white;width:100%}
.stop{background:#333;color:white;width:100%;margin-top:10px}
.status{padding:20px;text-align:center;border-radius:15px;margin:18px 0;font-weight:bold}
.green{background:#dcfce7;color:#166534}
.yellow{background:#fef3c7;color:#92400e}
.red{background:#fee2e2;color:#b91c1c}
.danger{background:#450a0a;color:white}
.light{font-size:45px}
.bar{height:18px;background:#ddd;border-radius:20px;overflow:hidden;margin:12px 0}
.fill{height:100%;width:0%;background:#16a34a;transition:.3s}
.info{background:#f2f6fc;padding:13px;border-radius:12px;margin:12px 0}
</style>
</head>
<body>
<div class="app">
<h1>⚡ COST ALARM</h1>
<p style="text-align:center">Smart Budget Monitoring System</p>

<label>মাসিক বাজেট (৳)</label>
<input id="budget" type="number" min="1" placeholder="উদাহরণ: 50000">

<label>বর্তমান মোট খরচ (৳)</label>
<input id="spent" type="number" min="0" placeholder="উদাহরণ: 25000">

<label>হলুদ সতর্কতা (%)</label>
<input id="yellowLimit" type="number" min="1" max="99" value="50">

<label>লাল সতর্কতা (%)</label>
<input id="redLimit" type="number" min="2" max="100" value="80">

<button class="primary" onclick="checkBudget()">🔍 বাজেট পরীক্ষা করুন</button>

<div id="status" class="status green">
<div class="light">🟢</div>
স্বাভাবিক
</div>

<div class="info">
<b>বাজেট ব্যবহারের হার:</b>
<div class="bar"><div class="fill" id="fill"></div></div>
<h2 id="percent">০%</h2>
</div>

<div class="info">
<p>মোট বাজেট: <b id="total">৳০</b></p>
<p>মোট খরচ: <b id="expense">৳০</b></p>
<p>অবশিষ্ট টাকা: <b id="remaining">৳০</b></p>
<p id="message">আপনার হিসাব এখানে দেখা যাবে।</p>
</div>

<button class="stop" onclick="stopAlarm()">🔇 অ্যালার্ম বন্ধ করুন</button>
</div>

<script>
let audioContext=null;
let alarmTimer=null;

function money(n){
 return "৳"+Number(n).toLocaleString("bn-BD");
}

function sound(){
 try{
  if(!audioContext){
   audioContext=new (window.AudioContext||window.webkitAudioContext)();
  }
  if(audioContext.state==="suspended")audioContext.resume();
  const oscillator=audioContext.createOscillator();
  const gain=audioContext.createGain();
  oscillator.connect(gain);
  gain.connect(audioContext.destination);
  oscillator.frequency.value=850;
  gain.gain.value=.15;
  oscillator.start();
  oscillator.stop(audioContext.currentTime+.35);
 }catch(e){}
}

function startAlarm(){
 stopAlarm();
 sound();
 alarmTimer=setInterval(sound,1200);
}

function stopAlarm(){
 if(alarmTimer){
  clearInterval(alarmTimer);
  alarmTimer=null;
 }
}

function checkBudget(){
 const budget=Number(document.getElementById("budget").value);
 const spent=Number(document.getElementById("spent").value);
 const yellow=Number(document.getElementById("yellowLimit").value);
 const red=Number(document.getElementById("redLimit").value);

 if(!Number.isFinite(budget)||!Number.isFinite(spent)||
 budget<=0||spent<0||
 !Number.isInteger(yellow)||!Number.isInteger(red)||
 yellow<1||yellow>=red||red>100){
  alert("সঠিক বাজেট, খরচ এবং সতর্কতার সীমা লিখুন।");
  return;
 }

 const rate=spent/budget*100;
 const percent=Math.round(rate);
 const remaining=budget-spent;

 document.getElementById("total").textContent=money(budget);
 document.getElementById("expense").textContent=money(spent);
 document.getElementById("remaining").textContent=money(Math.max(0,remaining));
 document.getElementById("percent").textContent=percent.toLocaleString("bn-BD")+"%";

 document.getElementById("fill").style.width=Math.min(100,rate)+"%";

 const status=document.getElementById("status");
 const message=document.getElementById("message");
 status.className="status";

 if(rate>=100){
  status.classList.add("danger");
  status.innerHTML='<div class="light">🚨</div>বাজেট শেষ! জরুরি অ্যালার্ম!';
  message.textContent="আপনার বাজেট "+money(spent-budget)+" অতিক্রম করেছে!";
  startAlarm();
 }else if(rate>=red){
  status.classList.add("red");
  status.innerHTML='<div class="light">🔴</div>বিপদ! খরচ অনেক বেশি!';
  message.textContent="সতর্কতা! আপনার বাজেট প্রায় শেষ।";
  startAlarm();
 }else if(rate>=yellow){
  status.classList.add("yellow");
  status.innerHTML='<div class="light">🟡</div>সতর্কতা! খরচ বাড়ছে!';
  message.textContent="আপনার বাজেটের ব্যবহার বেড়েছে। খরচ নিয়ন্ত্রণ করুন।";
  stopAlarm();
 }else{
  status.classList.add("green");
  status.innerHTML='<div class="light">🟢</div>সবকিছু স্বাভাবিক!';
  message.textContent="আপনার বাজেট নিরাপদ আছে।";
  stopAlarm();
 }

 if(rate>=100){
  if("Notification" in window && Notification.permission==="granted"){
   new Notification("Cost Alarm: বাজেট শেষ!",{
    body:"আপনার বাজেট অতিক্রম হয়েছে।"
   });
  }
 }
}

if("Notification" in window && Notification.permission==="default"){
 // Notification permission is requested only after user interaction.
}
</script>
</body>
</html>
